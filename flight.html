<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Check Overhead Flight Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #2c3e50;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-scan { background-color: #2980b9; }
        .btn-scan:hover { background-color: #2471a3; }

        #status {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        #alert-banner {
            display: none;
            background-color: #e74c3c;
            color: white;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .flight-card {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #27ae60;
        }
        .flight-card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #2c3e50;
        }
        .flight-card p {
            margin: 4px 0;
            font-size: 14px;
        }
        .loading-details {
            color: #e67e22;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✈️ Manual Overhead Flight Tracker</h1>
        <p>Enter a UK postcode and click <strong>"Scan Sky Now"</strong> to check for low-flying aircraft (&lt;5,000 ft, 5km zone) on demand.</p>
        
        <div class="input-group">
            <input type="text" id="postcode" placeholder="e.g. SW1A 1AA">
            <button class="btn-scan" onclick="scanAirspace()">Scan Sky Now</button>
        </div>

        <div id="alert-banner">🚨 LOW-FLYING AIRCRAFT DETECTED DIRECTLY OVERHEAD! 🚨</div>
        <div id="status">Status: Ready</div>
        <div id="results"></div>
    </div>

    <script>
        let hexDbCache = {};

        async function scanAirspace() {
            const postcode = document.getElementById('postcode').value.trim();
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            const alertBanner = document.getElementById('alert-banner');
            
            if (!postcode) {
                alert("Please enter a UK postcode first.");
                return;
            }

            statusDiv.innerHTML = "🔍 Locating postcode coordinates...";
            resultsDiv.innerHTML = "";
            alertBanner.style.display = "none";

            try {
                // STEP 1: Get coordinates from Postcodes.io
                const geoRes = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(postcode)}`);
                if (!geoRes.ok) throw new Error("Invalid UK postcode");
                const geoData = await geoRes.json();
                const lat = geoData.result.latitude;
                const lon = geoData.result.longitude;
                
                statusDiv.innerHTML = `📍 Target locked (${lat.toFixed(4)}, ${lon.toFixed(4)}). Querying OpenSky...`;

                // STEP 2: 5km radius bounding box (~0.045 degrees offset)
                const buffer = 0.045; 
                const lamin = lat - buffer, lamax = lat + buffer;
                const lomin = lon - buffer, lomax = lon + buffer;

                const targetUrl = `https://opensky-network.org/api/states/all?lamin=${lamin}&lamax=${lamax}&lomin=${lomin}&lomax=${lomax}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                const textResponse = await response.text();

                if (textResponse.includes("Too many requests") || response.status === 429) {
                    statusDiv.innerHTML = `⚠️ OpenSky Rate Limit Hit (429). Please wait a moment before trying again.`;
                    return;
                }

                let data;
                try {
                    data = JSON.parse(textResponse);
                } catch (e) {
                    throw new Error("Received malformed response from proxy/server.");
                }
                
                const flights = data.states || [];

                // Filter for flights under 5,000 feet (~1524 meters)
                const lowFlights = flights.filter(f => {
                    const altMeters = f[7];
                    return altMeters !== null && altMeters <= 1524;
                });

                if (lowFlights.length === 0) {
                    statusDiv.innerHTML = `❌ Scan complete: No aircraft under 5,000 ft found in the 5km zone right now. (Checked at ${new Date().toLocaleTimeString()})`;
                    return;
                }

                statusDiv.innerHTML = `✅ Found ${lowFlights.length} low-altitude aircraft within 5km! (Checked at ${new Date().toLocaleTimeString()})`;
                alertBanner.style.display = "block";

                for (let flight of lowFlights) {
                    const icaoHex = flight[0];
                    const callsign = flight[1] ? flight[1].trim() : "Unknown Callsign";
                    const country = flight[2] || "Unknown";
                    const altMeters = Math.round(flight[7]);
                    const altFeet = Math.round(altMeters * 3.28084);
                    const velocityMs = flight[9];
                    const speedKmph = velocityMs ? Math.round(velocityMs * 3.6) : "Unknown";

                    const card = document.createElement('div');
                    card.className = 'flight-card';
                    card.innerHTML = `
                        <h3>✈️ Callsign: ${callsign}</h3>
                        <p><strong>ICAO Hex:</strong> ${icaoHex} | <strong>Country Reg:</strong> ${country}</p>
                        <p><strong>Altitude:</strong> ${altFeet.toLocaleString()} ft | <strong>Speed:</strong> ${speedKmph} km/h</p>
                        <p class="loading-details" id="details-${icaoHex}">🔄 Querying HexDB...</p>
                    `;
                    resultsDiv.appendChild(card);

                    // Fetch HexDB details asynchronously
                    fetchAircraftDetails(icaoHex).then(details => {
                        const detailsEl = document.getElementById(`details-${icaoHex}`);
                        if (detailsEl) {
                            if (details) {
                                const reg = details.Registration || "Unknown Reg";
                                const type = details.Type || details.ICAOTypeCode || "Unknown Model";
                                const operator = details.RegisteredOwner || details.Operator || "Unknown Operator";
                                detailsEl.outerHTML = `
                                    <p><strong>Registration (Tail):</strong> ${reg}</p>
                                    <p><strong>Aircraft Type:</strong> ${type}</p>
                                    <p><strong>Operator/Owner:</strong> ${operator}</p>
                                `;
                            } else {
                                detailsEl.innerHTML = `⚠️ Extended database info unavailable.`;
                                detailsEl.className = "";
                            }
                        }
                    });
                }

            } catch (err) {
                statusDiv.innerHTML = `⚠️ Error: ${err.message}`;
            }
        }

        async function fetchAircraftDetails(icaoHex) {
            if (hexDbCache[icaoHex]) return hexDbCache[icaoHex];

            try {
                const response = await fetch(`https://hexdb.io/api/v1/aircraft/icao/${icaoHex}`);
                if (response.ok) {
                    const data = await response.json();
                    hexDbCache[icaoHex] = data;
                    return data;
                }
            } catch (e) {
                console.warn("HexDB lookup failed for", icaoHex);
            }
            return null;
        }
    </script>
</body>
</html>
