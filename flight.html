<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overhead Flight Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #2c3e50;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #status {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .flight-card {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #3498db;
        }
        .flight-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .flight-card p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✈️ Overhead Flight Tracker</h1>
        <p>Enter a UK postcode to see what aircraft are currently flying within roughly 2km of that location.</p>
        
        <div class="input-group">
            <input type="text" id="postcode" placeholder="e.g. SW1A 1AA">
            <button onclick="scanAirspace()">Scan Sky</button>
        </div>

        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        async function scanAirspace() {
            const postcode = document.getElementById('postcode').value.trim();
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            if (!postcode) {
                statusDiv.innerHTML = "⚠️ Please enter a postcode.";
                return;
            }

            statusDiv.innerHTML = "🔍 Locating postcode...";
            resultsDiv.innerHTML = ""; // Clear previous results

            try {
                // STEP 1: Get coordinates from Postcodes.io
                const geoResponse = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(postcode)}`);
                if (!geoResponse.ok) throw new Error("Invalid UK postcode");
                
                const geoData = await geoResponse.json();
                const lat = geoData.result.latitude;
                const lon = geoData.result.longitude;
                
                statusDiv.innerHTML = `📍 Postcode found! Scanning airspace around Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}...`;

                // STEP 2: Calculate Bounding Box (approx 2km radius using 0.02 degrees)
                const buffer = 0.02;
                const lamin = lat - buffer;
                const lamax = lat + buffer;
                const lomin = lon - buffer;
                const lomax = lon + buffer;

                // STEP 3: Query OpenSky Network
                const openSkyUrl = `https://opensky-network.org/api/states/all?lamin=${lamin}&lamax=${lamax}&lomin=${lomin}&lomax=${lomax}`;
                const skyResponse = await fetch(openSkyUrl);
                
                if (!skyResponse.ok) throw new Error("Could not connect to OpenSky Network");
                const skyData = await skyResponse.json();

                // STEP 4: Display Results
                const flights = skyData.states;

                if (!flights || flights.length === 0) {
                    statusDiv.innerHTML = "❌ No planes currently detected directly over this area.";
                } else {
                    statusDiv.innerHTML = `✅ Found ${flights.length} aircraft overhead!`;
                    
                    flights.forEach(flight => {
                        // OpenSky array indices: 1=callsign, 2=country, 7=altitude (meters)
                        const callsign = flight[1] ? flight[1].trim() : "Unknown Callsign";
                        const country = flight[2] ? flight[2] : "Unknown";
                        const altitudeMeters = flight[7] ? Math.round(flight[7]) : null;
                        const altitudeText = altitudeMeters ? `${altitudeMeters} meters (${Math.round(altitudeMeters * 3.28084)} feet)` : "Ground/Unknown";

                        const card = document.createElement('div');
                        card.className = 'flight-card';
                        card.innerHTML = `
                            <h3>${callsign}</h3>
                            <p><strong>Country of Registration:</strong> ${country}</p>
                            <p><strong>Altitude:</strong> ${altitudeText}</p>
                        `;
                        resultsDiv.appendChild(card);
                    });
                }
            } catch (error) {
                statusDiv.innerHTML = `⚠️ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
