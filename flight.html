<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overhead Low-Altitude Flight Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #2c3e50;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-start { background-color: #27ae60; }
        .btn-start:hover { background-color: #219653; }
        .btn-stop { background-color: #c0392b; }
        .btn-stop:hover { background-color: #a93226; }

        #status {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        #alert-banner {
            display: none;
            background-color: #e74c3c;
            color: white;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .flight-card {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #27ae60;
        }
        .flight-card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #2c3e50;
        }
        .flight-card p {
            margin: 4px 0;
            font-size: 14px;
        }
        .loading-details {
            color: #e67e22;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✈️ Low-Altitude Overhead Tracker</h1>
        <p>Monitoring aircraft under <strong>5,000 feet</strong> within a tight <strong>5km radius</strong> zone.</p>
        
        <div class="input-group">
            <input type="text" id="postcode" placeholder="e.g. SW1A 1AA">
            <button id="toggleButton" class="btn-start" onclick="toggleTracker()">Start Monitoring</button>
        </div>

        <div id="alert-banner">🚨 LOW-FLYING AIRCRAFT DETECTED DIRECTLY OVERHEAD! 🚨</div>
        <div id="status">Status: Stopped</div>
        <div id="results"></div>
    </div>

    <script>
        let timer = null;
        let isRunning = false;
        let cachedLat = null;
        let cachedLon = null;
        let currentlySeenFlights = new Set(); 
        let hexDbCache = {};

        async function toggleTracker() {
            const btn = document.getElementById('toggleButton');
            const postcode = document.getElementById('postcode').value.trim();

            if (!isRunning) {
                if (!postcode) {
                    alert("Please enter a UK postcode first.");
                    return;
                }
                
                isRunning = true;
                btn.innerText = "Stop Monitoring";
                btn.className = "btn-stop";
                document.getElementById('postcode').disabled = true;
                document.getElementById('status').innerHTML = "🔍 Locating postcode coordinates...";
                
                try {
                    const geoRes = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(postcode)}`);
                    if (!geoRes.ok) throw new Error("Invalid UK postcode");
                    const geoData = await geoRes.json();
                    cachedLat = geoData.result.latitude;
                    cachedLon = geoData.result.longitude;
                    
                    document.getElementById('status').innerHTML = `📍 Target locked (${cachedLat.toFixed(4)}, ${cachedLon.toFixed(4)}). Scanning 5km zone every 15s...`;
                    
                    scanAirspace();
                    timer = setInterval(scanAirspace, 15000);

                } catch (error) {
                    document.getElementById('status').innerHTML = `⚠️ Error: ${error.message}`;
                    stopTracker();
                }
            } else {
                stopTracker();
            }
        }

        function stopTracker() {
            isRunning = false;
            clearInterval(timer);
            const btn = document.getElementById('toggleButton');
            btn.innerText = "Start Monitoring";
            btn.className = "btn-start";
            document.getElementById('postcode').disabled = false;
            document.getElementById('status').innerHTML = "Status: Stopped";
            document.getElementById('alert-banner').style.display = "none";
        }

        async function fetchAircraftDetails(icaoHex) {
            if (hexDbCache[icaoHex]) return hexDbCache[icaoHex];

            try {
                const response = await fetch(`https://hexdb.io/api/v1/aircraft/icao/${icaoHex}`);
                if (response.ok) {
                    const data = await response.json();
                    hexDbCache[icaoHex] = data;
                    return data;
                }
            } catch (e) {
                console.warn("HexDB lookup failed for", icaoHex);
            }
            return null;
        }

        async function scanAirspace() {
            if (!cachedLat || !cachedLon) return;

            // 5km radius boundary box (~0.045 degrees latitude/longitude offset)
            const buffer = 0.045; 
            const lamin = cachedLat - buffer, lamax = cachedLat + buffer;
            const lomin = cachedLon - buffer, lomax = cachedLon + buffer;

            const targetUrl = `https://opensky-network.org/api/states/all?lamin=${lamin}&lamax=${lamax}&lomin=${lomin}&lomax=${lomax}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("OpenSky rate-limited or proxy blocked. Wait 1 minute.");
                const data = await response.json();
                
                const flights = data.states || [];
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = "";

                let newFlightFoundThisCycle = false;
                let activeHexCodesThisCycle = new Set();

                // Filter for flights under 5,000 feet (~1524 meters)
                const lowFlights = flights.filter(f => {
                    const altMeters = f[7];
                    return altMeters !== null && altMeters <= 1524;
                });

                if (lowFlights.length === 0) {
                    document.getElementById('status').innerHTML = `Scanning 5km zone... No aircraft under 5k ft right now. (Last check: ${new Date().toLocaleTimeString()})`;
                    document.getElementById('alert-banner').style.display = "none";
                    currentlySeenFlights.clear();
                    return;
                }

                document.getElementById('status').innerHTML = `✅ Found ${lowFlights.length} low-altitude aircraft within 5km! (Last check: ${new Date().toLocaleTimeString()})`;

                for (let flight of lowFlights) {
                    const icaoHex = flight[0];
                    const callsign = flight[1] ? flight[1].trim() : "Unknown Callsign";
                    const country = flight[2] || "Unknown";
                    const altMeters = Math.round(flight[7]);
                    const altFeet = Math.round(altMeters * 3.28084);
                    const velocityMs = flight[9];
                    const speedKmph = velocityMs ? Math.round(velocityMs * 3.6) : "Unknown";

                    activeHexCodesThisCycle.add(icaoHex);

                    if (!currentlySeenFlights.has(icaoHex)) {
                        newFlightFoundThisCycle = true;
                    }

                    const cardId = `flight-${icaoHex}`;
                    const card = document.createElement('div');
                    card.className = 'flight-card';
                    card.id = cardId;
                    card.innerHTML = `
                        <h3>✈️ Callsign: ${callsign}</h3>
                        <p><strong>ICAO Hex:</strong> ${icaoHex} | <strong>Country Reg:</strong> ${country}</p>
                        <p><strong>Altitude:</strong> ${altFeet.toLocaleString()} ft | <strong>Speed:</strong> ${speedKmph} km/h</p>
                        <p class="loading-details" id="details-${icaoHex}">🔄 Querying HexDB...</p>
                    `;
                    resultsDiv.appendChild(card);

                    fetchAircraftDetails(icaoHex).then(details => {
                        const detailsEl = document.getElementById(`details-${icaoHex}`);
                        if (detailsEl) {
                            if (details) {
                                const reg = details.Registration || "Unknown Reg";
                                const type = details.Type || details.ICAOTypeCode || "Unknown Model";
                                const operator = details.RegisteredOwner || details.Operator || "Unknown Operator";
                                detailsEl.outerHTML = `
                                    <p><strong>Registration (Tail):</strong> ${reg}</p>
                                    <p><strong>Aircraft Type:</strong> ${type}</p>
                                    <p><strong>Operator/Owner:</strong> ${operator}</p>
                                `;
                            } else {
                                detailsEl.innerHTML = `⚠️ Extended database info unavailable.`;
                                detailsEl.className = "";
                            }
                        }
                    });
                }

                if (newFlightFoundThisCycle) {
                    document.getElementById('alert-banner').style.display = "block";
                } else {
                    document.getElementById('alert-banner').style.display = "none";
                }

                currentlySeenFlights = activeHexCodesThisCycle;

            } catch (err) {
                document.getElementById('status').innerHTML = `⚠️ Error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
