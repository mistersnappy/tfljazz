<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallel Eras: Synchronous Multi-Column History Timeline</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --col-biblical: #f59e0b; 
            --col-explorer: #38bdf8; 
            --col-invention: #34d399;
            --col-british: #fbbf24;  
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        header {
            max-width: 1400px;
            margin: 0 auto 30px auto;
            text-align: center;
        }
        h1 {
            letter-spacing: 2px;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }
        .timeline-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Multi-column grid layout */
        .grid-header {
            display: grid;
            grid-template-columns: 100px repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .col-header { padding: 10px; border-radius: 6px; }
        .h-biblical { background: rgba(245, 158, 11, 0.15); color: var(--col-biblical); border: 1px solid rgba(245, 158, 11, 0.3); }
        .h-explorer { background: rgba(56, 189, 248, 0.15); color: var(--col-explorer); border: 1px solid rgba(56, 189, 248, 0.3); }
        .h-invention { background: rgba(52, 211, 153, 0.15); color: var(--col-invention); border: 1px solid rgba(52, 211, 153, 0.3); }
        .h-british { background: rgba(251, 191, 36, 0.15); color: var(--col-british); border: 1px solid rgba(251, 191, 36, 0.3); }

        .time-row {
            display: grid;
            grid-template-columns: 100px repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            align-items: stretch;
        }
        .time-badge {
            background: #1e1b4b;
            color: #818cf8;
            border: 1px solid #312e81;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            padding: 10px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
        }
        .card:hover {
            border-color: #4b5563;
            transform: translateY(-2px);
        }
        .card.c-biblical { border-top: 3px solid var(--col-biblical); }
        .card.c-explorer { border-top: 3px solid var(--col-explorer); }
        .card.c-invention { border-top: 3px solid var(--col-invention); }
        .card.c-british { border-top: 3px solid var(--col-british); }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .card-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            flex-grow: 1;
        }
        .wiki-link {
            font-size: 11px;
            color: #818cf8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: auto;
        }
        .wiki-link:hover {
            text-decoration: underline;
            color: #a5b4fc;
        }
        .empty-cell {
            background: rgba(17, 24, 39, 0.3);
            border: 1px dashed rgba(31, 41, 55, 0.5);
            border-radius: 8px;
        }

        @media(max-width: 1024px) {
            .grid-header, .time-row {
                grid-template-columns: 1fr;
            }
            .time-badge { margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>PARALLEL ERAS</h1>
        <p class="subtitle">Synchronous multi-column history tracking precise chronological intersections with Wikipedia references.</p>
    </header>

    <div class="timeline-container" id="timelineGrid">
        <!-- Header Row -->
        <div class="grid-header">
            <div class="col-header" style="background:#111827; border:1px solid #1f2937; color:#9ca3af;">Period</div>
            <div class="col-header h-biblical">📜 Biblical & Near East</div>
            <div class="col-header h-explorer">🧭 Explorers & Maritime</div>
            <div class="col-header h-invention">💡 Inventions & Tech</div>
            <div class="col-header h-british">🇬🇧 British & European</div>
        </div>

        <!-- Chronological Rows -->
        <div id="rowsContainer"></div>
    </div>

    <script>
        // Strictly aligned chronological rows tracking parallel history
        const synchronousData = [
            {
                period: "c. 3500 – 3000 BCE",
                biblical: { title: "Early Patriarchal Era / Ur", desc: "Rise of early city-states in Mesopotamia, originating from regions like Ur.", url: "https://en.wikipedia.org/wiki/Ur" },
                explorer: null,
                invention: { title: "Invention of the Wheel & Writing", desc: "Sumerians develop cuneiform script and the earliest wheeled vehicles.", url: "https://en.wikipedia.org/wiki/Invention_of_the_wheel" },
                british: { title: "Stonehenge (Phase 1)", desc: "Construction begins on the outer circular bank and ditch in Wiltshire.", url: "https://en.wikipedia.org/wiki/Stonehenge" }
            },
            {
                period: "c. 1450 – 1400 BCE",
                biblical: { title: "The Exodus Era", desc: "Biblical tradition records the liberation of Israelites from Egypt and desert wanderings.", url: "https://en.wikipedia.org/wiki/The_Exodus" },
                explorer: null,
                invention: { title: "Late Bronze Age Metallurgy", desc: "Advanced bronze casting spreads rapidly for tools, armor, and weaponry.", url: "https://en.wikipedia.org/wiki/Bronze_Age" },
                british: { title: "Wessex Culture Bronze Hoards", desc: "Wealthy trade networks across Britain export gold artifacts to continental Europe.", url: "https://en.wikipedia.org/wiki/Wessex_culture" }
            },
            {
                period: "c. 950 – 900 BCE",
                biblical: { title: "Solomon's Temple Built", desc: "King Solomon completes the First Temple in Jerusalem.", url: "https://en.wikipedia.org/wiki/Solomon%27s_Temple" },
                explorer: null,
                invention: { title: "Early Iron Age Expansion", desc: "Iron working replaces bronze as the primary material for heavy tools.", url: "https://en.wikipedia.org/wiki/Iron_Age" },
                british: { title: "Celtic Hillfort Beginnings", desc: "Early fortified hilltop settlements begin appearing across Celtic Britain.", url: "https://en.wikipedia.org/wiki/Hillfort" }
            },
            {
                period: "c. 586 – 538 BCE",
                biblical: { title: "Babylonian Exile", desc: "Nebuchadnezzar II destroys Jerusalem; Jews are exiled to Babylon until Cyrus permits return.", url: "https://en.wikipedia.org/wiki/Babylonian_captivity" },
                explorer: { title: "Scylax's Indian Ocean Voyage", desc: "Persian-commissioned maritime expedition explores the Indus River and Arabian Sea.", url: "https://en.wikipedia.org/wiki/Scylax_of_Caryanda" },
                invention: { title: "Coinage Invented in Lydia", desc: "First standardized metal coins minted in Asia Minor, revolutionizing trade.", url: "https://en.wikipedia.org/wiki/History_of_coinage" },
                british: { title: "La Tène Culture Emerges", desc: "Distinct artistic and iron-working styles spread among British and European Celtic tribes.", url: "https://en.wikipedia.org/wiki/La_T%C3%A8ne_culture" }
            },
            {
                period: "c. 4 BCE – 30 CE",
                biblical: { title: "Life & Ministry of Jesus", desc: "Events of the Gospels unfold across Roman-occupied Judea and Galilee.", url: "https://en.wikipedia.org/wiki/Jesus" },
                explorer: { title: "Roman Maritime Trade to India", desc: "Monsoon shipping routes established connecting Red Sea ports directly to western India.", url: "https://en.wikipedia.org/wiki/Indo-Roman_trade_relations" },
                invention: { title: "Roman Concrete & Aqueducts", desc: "Engineers master hydraulic concrete, building massive infrastructure across the empire.", url: "https://en.wikipedia.org/wiki/Roman_concrete" },
                british: { title: "Pre-Roman British Kingdoms", desc: "Trading kingdoms like the Catuvellauni issue native coins prior to Roman invasion.", url: "https://en.wikipedia.org/wiki/Catuvellauni" }
            },
            {
                period: "70 – 79 CE",
                biblical: { title: "Destruction of Second Temple", desc: "Roman legions under Titus siege Jerusalem and dismantle the Second Temple.", url: "https://en.wikipedia.org/wiki/Siege_of_Jerusalem_(70_CE)" },
                explorer: { title: "Agricola's Exploration of Britain", desc: "Roman governor Gnaeus Julius Agricola sails fleets around the northern tip of Britain.", url: "https://en.wikipedia.org/wiki/Gnaeus_Julius_Agricola" },
                invention: { title: "Advanced Surgical Tools", desc: "Roman medical innovation produces specialized surgical scalpels, bone drills, and forceps.", url: "https://en.wikipedia.org/wiki/Roman_medicine" },
                british: { title: "Eruption of Mount Vesuvius", desc: "While Roman legions campaign in Britain, Pompeii is buried under volcanic ash.", url: "https://en.wikipedia.org/wiki/Pompeii" }
            },
            {
                period: "1215 – 1295 CE",
                biblical: { title: "Maimonides & Scholasticism", desc: "Philosophical integration of biblical texts with Aristotelian logic flourishes in medieval thought.", url: "https://en.wikipedia.org/wiki/Maimonides" },
                explorer: { title: "Marco Polo's Journey", desc: "Venetian explorer journeys along the Silk Road to the court of Kublai Khan.", url: "https://en.wikipedia.org/wiki/Marco_Polo" },
                invention: { title: "Spectacles Invented in Italy", desc: "First wearable eyeglasses with convex lenses developed in Northern Italy.", url: "https://en.wikipedia.org/wiki/Glasses" },
                british: { title: "Signing of the Magna Carta", desc: "King John signs the historic charter at Runnymede limiting royal authority.", url: "https://en.wikipedia.org/wiki/Magna_Carta" }
            },
            {
                period: "1405 – 1492 CE",
                biblical: { title: "Hebrew Printing & Renaissance", desc: "First printed Hebrew Bibles produced in Italy shortly after Gutenberg's breakthrough.", url: "https://en.wikipedia.org/wiki/Hebrew_incunabula" },
                explorer: { title: "Zheng He & Columbus Voyages", desc: "Chinese treasure fleets cross the Indian Ocean; decades later Columbus reaches the Americas.", url: "https://en.wikipedia.org/wiki/Zheng_He" },
                invention: { title: "Gutenberg's Printing Press", desc: "Movable type revolutionizes mass communication across Europe.", url: "https://en.wikipedia.org/wiki/Printing_press" },
                british: { title: "End of the Wars of the Roses", desc: "Tudor dynasty begins under Henry VII, stabilizing internal British rule.", url: "https://en.wikipedia.org/wiki/Wars_of_the_Roses" }
            },
            {
                period: "1768 – 1771 CE",
                biblical: { title: "The Haskalah (Jewish Enlightenment)", desc: "Cultural movement in Europe advocates integration into secular society and scientific study.", url: "https://en.wikipedia.org/wiki/Haskalah" },
                explorer: { title: "Captain James Cook's 1st Voyage", desc: "HMS Endeavour charts Tahiti, New Zealand, and the eastern coast of Australia.", url: "https://en.wikipedia.org/wiki/First_voyage_of_James_Cook" },
                invention: { title: "Watt's Steam Engine Patented", desc: "James Watt patents the separate condenser, igniting the Industrial Revolution.", url: "https://en.wikipedia.org/wiki/Watt_steam_engine" },
                british: { title: "Georgian Agricultural & Tech Boom", desc: "Britain experiences rapid industrial growth and agricultural modernization.", url: "https://en.wikipedia.org/wiki/Georgian_era" }
            },
            {
                period: "1867 – 1879 CE",
                biblical: { title: "Rise of Biblical Archaeology", desc: "Scientific excavation of Near Eastern historical sites and ancient Jerusalem begins.", url: "https://en.wikipedia.org/wiki/Biblical_archaeology" },
                explorer: { title: "Stanley & Livingstone in Africa", desc: "Henry Morton Stanley tracks down David Livingstone deep within the African interior.", url: "https://en.wikipedia.org/wiki/David_Livingstone" },
                invention: { title: "Edison's Incandescent Light Bulb", desc: "Practical electric lighting begins replacing gas lamps in homes and streets.", url: "https://en.wikipedia.org/wiki/Incandescent_light_bulb" },
                british: { title: "Peak Victorian Empire", desc: "Queen Victoria is proclaimed Empress of India; Britain's global influence peaks.", url: "https://en.wikipedia.org/wiki/Victorian_era" }
            }
        ];

        function renderGrid() {
            const container = document.getElementById("rowsContainer");
            container.innerHTML = "";

            synchronousData.forEach(row => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "time-row";

                // Time Badge
                const badge = document.createElement("div");
                badge.className = "time-badge";
                badge.textContent = row.period;
                rowDiv.appendChild(badge);

                // Helper to create card or empty slot
                const createCard = (data, catClass) => {
                    if (!data) {
                        const empty = document.createElement("div");
                        empty.className = "empty-cell";
                        return empty;
                    }
                    const card = document.createElement("div");
                    card.className = `card ${catClass}`;
                    card.innerHTML = `
                        <div>
                            <div class="card-title">${data.title}</div>
                            <p class="card-desc">${data.desc}</p>
                        </div>
                        <a href="${data.url}" target="_blank" class="wiki-link">
                            📖 Read on Wikipedia &rarr;
                        </a>
                    `;
                    return card;
                };

                rowDiv.appendChild(createCard(row.biblical, "c-biblical"));
                rowDiv.appendChild(createCard(row.explorer, "c-explorer"));
                rowDiv.appendChild(createCard(row.invention, "c-invention"));
                rowDiv.appendChild(createCard(row.british, "c-british"));

                container.appendChild(rowDiv);
            });
        }

        renderGrid();
    </script>
</body>
</html>
