<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallel Eras: Granular Synchronous History Timeline</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --col-biblical: #f59e0b; 
            --col-explorer: #38bdf8; 
            --col-invention: #34d399;
            --col-british: #fbbf24;  
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        header {
            max-width: 1400px;
            margin: 0 auto 30px auto;
            text-align: center;
        }
        h1 {
            letter-spacing: 2px;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }
        .timeline-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .grid-header {
            display: grid;
            grid-template-columns: 120px repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .col-header { padding: 10px; border-radius: 6px; }
        .h-biblical { background: rgba(245, 158, 11, 0.15); color: var(--col-biblical); border: 1px solid rgba(245, 158, 11, 0.3); }
        .h-explorer { background: rgba(56, 189, 248, 0.15); color: var(--col-explorer); border: 1px solid rgba(56, 189, 248, 0.3); }
        .h-invention { background: rgba(52, 211, 153, 0.15); color: var(--col-invention); border: 1px solid rgba(52, 211, 153, 0.3); }
        .h-british { background: rgba(251, 191, 36, 0.15); color: var(--col-british); border: 1px solid rgba(251, 191, 36, 0.3); }

        .time-row {
            display: grid;
            grid-template-columns: 120px repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            align-items: stretch;
        }
        .time-badge {
            background: #1e1b4b;
            color: #818cf8;
            border: 1px solid #312e81;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            padding: 10px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
        }
        .card:hover {
            border-color: #4b5563;
            transform: translateY(-2px);
        }
        .card.c-biblical { border-top: 3px solid var(--col-biblical); }
        .card.c-explorer { border-top: 3px solid var(--col-explorer); }
        .card.c-invention { border-top: 3px solid var(--col-invention); }
        .card.c-british { border-top: 3px solid var(--col-british); }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .card-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            flex-grow: 1;
        }
        .wiki-link {
            font-size: 11px;
            color: #818cf8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: auto;
        }
        .wiki-link:hover {
            text-decoration: underline;
            color: #a5b4fc;
        }
        .empty-cell {
            background: rgba(17, 24, 39, 0.3);
            border: 1px dashed rgba(31, 41, 55, 0.5);
            border-radius: 8px;
        }

        @media(max-width: 1024px) {
            .grid-header, .time-row {
                grid-template-columns: 1fr;
            }
            .time-badge { margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>PARALLEL ERAS</h1>
        <p class="subtitle">Granular multi-column history tracking precise chronological intersections with Wikipedia references.</p>
    </header>

    <div class="timeline-container" id="timelineGrid">
        <div class="grid-header">
            <div class="col-header" style="background:#111827; border:1px solid #1f2937; color:#9ca3af;">Period</div>
            <div class="col-header h-biblical">📜 Biblical & Near East</div>
            <div class="col-header h-explorer">🧭 Explorers & Maritime</div>
            <div class="col-header h-invention">💡 Inventions & Tech</div>
            <div class="col-header h-british">🇬🇧 British & European</div>
        </div>

        <div id="rowsContainer"></div>
    </div>

    <script>
        // High-granularity synchronous dataset
        const synchronousData = [
            {
                period: "c. 3500 BCE",
                biblical: { title: "Early Uruk & Sumerian Rise", desc: "Development of temple administration and early proto-cuneiform records in Mesopotamia.", url: "https://en.wikipedia.org/wiki/Uruk" },
                explorer: null,
                invention: { title: "Invention of the Wheel", desc: "First use of the wheel for pottery and transport across Mesopotamia.", url: "https://en.wikipedia.org/wiki/Invention_of_the_wheel" },
                british: { title: "Stonehenge Phase 1", desc: "Excavation of the outer ditch and circular bank in Wiltshire begins.", url: "https://en.wikipedia.org/wiki/Stonehenge" }
            },
            {
                period: "c. 2100 BCE",
                biblical: { title: "The Migration of Abraham", desc: "Biblical narrative records Abraham moving from Ur of the Chaldees toward Canaan.", url: "https://en.wikipedia.org/wiki/Abraham" },

            },
            {

            },
            {
                period: "c. 950 BCE",
                biblical: { title: "Solomon's Temple Completed", desc: "King Solomon finishes construction of the First Temple in Jerusalem.", url: "https://en.wikipedia.org/wiki/Solomon%27s_Temple" },
                explorer: null,
                invention: { title: "Early Iron Smelting Spread", desc: "Iron metallurgy becomes viable for mass production of tools and farm implements.", url: "https://en.wikipedia.org/wiki/Iron_Age" },
                british: { title: "Hillfort Construction Begins", desc: "Celtic communities start building fortified hilltop enclosures across Britain.", url: "https://en.wikipedia.org/wiki/Hillfort" }
            },

                explorer: { title: "Scylax's Indian Ocean Expedition", desc: "First recorded maritime exploration mapping river routes into the Indian Ocean for Persia.", url: "https://en.wikipedia.org/wiki/Scylax_of_Caryanda" },
                invention: { title: "First Standardized Coinage", desc: "The Kingdom of Lydia mints the first official metal coins, accelerating commerce.", url: "https://en.wikipedia.org/wiki/History_of_coinage" },
                british: { title: "La Tène Celtic Culture", desc: "Distinct European Celtic art and iron-craft styles begin influencing British tribes.", url: "https://en.wikipedia.org/wiki/La_T%C3%A8ne_culture" }
            },
            {

                british: { title: "Pre-Conquest Client Kingdoms", desc: "British tribal kingdoms maintain heavy diplomatic and trade ties with the Roman Empire.", url: "https://en.wikipedia.org/wiki/Catuvellauni" }
            },
            {
                period: "70 – 79 CE",
                biblical: { title: "Siege & Destruction of Jerusalem", desc: "Roman armies under Titus crush the Jewish revolt and dismantle the Second Temple.", url: "https://en.wikipedia.org/wiki/Siege_of_Jerusalem_(70_CE)" },
                explorer: { title: "Agricola Circumnavigates Britain", desc: "Roman naval fleet maps the northernmost coasts and islands of Scotland.", url: "https://en.wikipedia.org/wiki/Gnaeus_Julius_Agricola" },
                invention: { title: "Advanced Surgical Instruments", desc: "Roman medicine sees sophisticated metal scalpels, hooks, and bone levers.", url: "https://en.wikipedia.org/wiki/Roman_medicine" },

            },
            {
                period: "122 CE",
                biblical: { title: "Bar Kokhba Revolt Preparations", desc: "Tensions rise in Judea leading up to the final major Jewish-Roman war.", url: "https://en.wikipedia.org/wiki/Bar_Kokhba_revolt" },
                explorer: { title: "Ptolemy's Geographia Mapping", desc: "Greco-Roman scholar compiles global coordinates and trade routes across the known world.", url: "https://en.wikipedia.org/wiki/Geographia" },
                invention: { title: "Heavy Stone Masonry Techniques", desc: "Standardized quarrying and crane technology used for massive imperial structures.", url: "https://en.wikipedia.org/wiki/Crane_(machine)#History" },

            },
            {

                biblical: { title: "Maimonides' Legacy & Scholasticism", desc: "Integration of biblical philosophy and Aristotelian science peaks in Mediterranean scholarship.", url: "https://en.wikipedia.org/wiki/Maimonides" },
                explorer: { title: "Mongol Empire Trans-Eurasian Routes", desc: "Pax Mongolica secures safe trade and diplomatic travel across the entire Asian continent.", url: "https://en.wikipedia.org/wiki/Pax_Mongolica" },
                invention: { title: "Invention of Eyeglasses", desc: "First wearable convex reading lenses invented in Northern Italy.", url: "https://en.wikipedia.org/wiki/Glasses" },
                british: { title: "Signing of the Magna Carta", desc: "King John signs the historic charter at Runnymede establishing rule of law.", url: "https://en.wikipedia.org/wiki/Magna_Carta" }
            },
            {
                period: "1271 – 1295 CE",
                biblical: { title: "Syrian Christian Expansion", desc: "Nestorian Christian communities thrive along Asian trade routes visited by western travelers.", url: "https://en.wikipedia.org/wiki/Church_of_the_East_in_China" },
                explorer: { title: "Marco Polo's Journey to China", desc: "Venetian merchant travels the Silk Road and serves in the court of Kublai Khan.", url: "https://en.wikipedia.org/wiki/Marco_Polo" },
                invention: { title: "Early Mechanical Clocks", desc: "Weight-driven mechanical clocks begin appearing in European monasteries and towers.", url: "https://en.wikipedia.org/wiki/Clock#History" },
                british: { title: "Model Parliament Convened", desc: "King Edward I summons the Model Parliament, setting a precedent for representative governance.", url: "https://en.wikipedia.org/wiki/Model_Parliament" }
            },
            {
                period: "1405 – 1433 CE",
                biblical: { title: "Judean Communities in Ming China", desc: "Kaifeng Jewish community flourishes along active Silk Road trade intersections.", url: "https://en.wikipedia.org/wiki/Kaifeng_Jews" },
                explorer: { title: "Zheng He's Treasure Fleet Voyages", desc: "Chinese admiral commands massive fleets across the Indian Ocean to East Africa.", url: "https://en.wikipedia.org/wiki/Zheng_He" },
                invention: { title: "Multimast Treasure Ships", desc: "Chinese shipbuilding masters watertight bulkheads and balanced rudder systems.", url: "https://en.wikipedia.org/wiki/Chinese_treasure_ship" },
                british: { title: "Battle of Agincourt", desc: "King Henry V achieves a stunning military victory during the Hundred Years' War.", url: "https://en.wikipedia.org/wiki/Battle_of_Agincourt" }
            },
            {
                period: "1455 – 1492 CE",
                biblical: { title: "First Printed Hebrew Bibles", desc: "Gutenberg's press enables the rapid production of Hebrew script and biblical texts in Europe.", url: "https://en.wikipedia.org/wiki/Hebrew_incunabula" },
                explorer: { title: "Columbus Crosses the Atlantic", desc: "Christopher Columbus reaches the Americas, permanently uniting world maps.", url: "https://en.wikipedia.org/wiki/Voyages_of_Christopher_Columbus" },
                invention: { title: "Gutenberg's Movable-Type Press", desc: "Mechanical printing revolutionizes information sharing and literacy in Europe.", url: "https://en.wikipedia.org/wiki/Printing_press" },
                british: { title: "End of the Wars of the Roses", desc: "The Tudor dynasty is established under Henry VII, bringing internal peace to England.", url: "https://en.wikipedia.org/wiki/Wars_of_the_Roses" }
            },
            {
                period: "1768 – 1771 CE",
                biblical: { title: "The Haskalah (Jewish Enlightenment)", desc: "European movement encourages secular education, scientific study, and biblical critique.", url: "https://en.wikipedia.org/wiki/Haskalah" },
                explorer: { title: "Captain James Cook's First Voyage", desc: "HMS Endeavour maps Tahiti, New Zealand, and the eastern seaboard of Australia.", url: "https://en.wikipedia.org/wiki/First_voyage_of_James_Cook" },
                invention: { title: "Watt's Steam Engine Patented", desc: "James Watt patents the separate condenser, fueling the Industrial Revolution.", url: "https://en.wikipedia.org/wiki/Watt_steam_engine" },
                british: { title: "Agricultural & Industrial Boom", desc: "Britain undergoes rapid modernization in farming, textiles, and factory production.", url: "https://en.wikipedia.org/wiki/Industrial_Revolution_in_Britain" }
            },
            {
                period: "1867 – 1879 CE",
                biblical: { title: "Birth of Modern Biblical Archaeology", desc: "Scientific excavation begins on ancient Near Eastern ruins and Jerusalem's foundations.", url: "https://en.wikipedia.org/wiki/Biblical_archaeology" },
                explorer: { title: "Stanley & Livingstone Expeditions", desc: "Exploration maps the interior river basins and lakes of Central Africa.", url: "https://en.wikipedia.org/wiki/Henry_Morton_Stanley" },
                invention: { title: "Edison's Incandescent Light Bulb", desc: "Practical electric lighting begins replacing oil and gas lamps globally.", url: "https://en.wikipedia.org/wiki/Incandescent_light_bulb" },
                british: { title: "Peak of the Victorian Empire", desc: "Queen Victoria is named Empress of India; Britain governs a global superpower empire.", url: "https://en.wikipedia.org/wiki/Victorian_era" }
            }
        ];

        function renderGrid() {
            const container = document.getElementById("rowsContainer");
            container.innerHTML = "";

            synchronousData.forEach(row => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "time-row";

                const badge = document.createElement("div");
                badge.className = "time-badge";
                badge.textContent = row.period;
                rowDiv.appendChild(badge);

                const createCard = (data, catClass) => {
                    if (!data) {
                        const empty = document.createElement("div");
                        empty.className = "empty-cell";
                        return empty;
                    }
                    const card = document.createElement("div");
                    card.className = `card ${catClass}`;
                    card.innerHTML = `
                        <div>
                            <div class="card-title">${data.title}</div>
                            <p class="card-desc">${data.desc}</p>
                        </div>
                        <a href="${data.url}" target="_blank" class="wiki-link">
                            📖 Read on Wikipedia &rarr;
                        </a>
                    `;
                    return card;
                };

                rowDiv.appendChild(createCard(row.biblical, "c-biblical"));
                rowDiv.appendChild(createCard(row.explorer, "c-explorer"));
                rowDiv.appendChild(createCard(row.invention, "c-invention"));
                rowDiv.appendChild(createCard(row.british, "c-british"));

                container.appendChild(rowDiv);
            });
        }

        renderGrid();
    </script>
</body>
</html>
