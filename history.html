<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallel Eras: Synchronous History Timeline</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-1: #38bdf8; /* Science & Archaeology */
            --accent-2: #f43f5e; /* Empires */
            --accent-3: #34d399; /* Culture */
            --accent-4: #fbbf24; /* British & Global */
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        header {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            text-align: center;
        }
        h1 {
            letter-spacing: 2px;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #4f46e5;
            border-color: #6366f1;
        }
        .timeline-container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }
        /* Central vertical axis */
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #374151;
            transform: translateX(-50%);
        }
        .era-block {
            margin-bottom: 40px;
            position: relative;
        }
        .era-header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }
        .era-title {
            background: #1e1b4b;
            color: #818cf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #312e81;
            display: inline-block;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.3);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 60px 1fr;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }
        .card:hover {
            border-color: #4b5563;
            transform: translateY(-2px);
        }
        .card.cat-empire { border-left: 4px solid var(--accent-2); }
        .card.cat-archaeology { border-left: 4px solid var(--accent-1); }
        .card.cat-culture { border-left: 4px solid var(--accent-3); }
        .card.cat-british { border-left: 4px solid var(--accent-4); }

        .year-badge {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }
        .center-node {
            width: 16px;
            height: 16px;
            background: #4f46e5;
            border: 3px solid var(--bg-color);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 0 2px #6366f1;
        }
        .empty-slot {
            visibility: hidden;
        }
        @media(max-width: 768px) {
            .timeline-container::before { left: 20px; }
            .row { grid-template-columns: 40px 1fr; }
            .card-left { grid-column: 2; }
            .card-right { grid-column: 2; }
            .center-node { grid-column: 1; grid-row: 1; margin: 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>PARALLEL ERAS</h1>
        <p class="subtitle">Discovering archaeological milestones, British history, and global synchronicity.</p>
        
        <div class="controls">
            <button class="filter-btn active" onclick="filterCategory('all', this)">All Categories</button>
            <button class="filter-btn" onclick="filterCategory('archaeology', this)">🏺 Archaeology & Relics</button>
            <button class="filter-btn" onclick="filterCategory('british', this)">🇬🇧 British History</button>
            <button class="filter-btn" onclick="filterCategory('empire', this)">🏛️ Empires & Power</button>
            <button class="filter-btn" onclick="filterCategory('culture', this)">🎨 Culture & Philosophy</button>
        </div>
    </header>

    <div class="timeline-container" id="timeline">
        <!-- Timeline rows injected dynamically via JavaScript -->
    </div>

    <script>
        const timelineData = [
            {
                era: "Ancient Foundations & Megaliths",
                events: [
                    { year: "c. 3000 BCE", title: "Construction of Stonehenge (Phase 1)", desc: "The first henge monument is built in Wiltshire, England—consisting of a circular ditch and bank.", category: "british" },
                    { year: "c. 950 BCE", title: "King Solomon Builds the First Temple", desc: "The First Temple (Solomon's Temple) is completed in Jerusalem, housing the Ark of the Covenant.", category: "archaeology" }
                ]
            },
            {
                era: "Iron Age Britain & Empires",
                events: [
                    { year: "c. 586 BCE", title: "Destruction of Solomon's Temple", desc: "Nebuchadnezzar II and the Neo-Babylonian Empire besiege Jerusalem, destroying the First Temple and exiling the Jews.", category: "archaeology" },
                    { year: "c. 500 BCE", title: "Iron Age Hillforts Spread in Britain", desc: "Celtic-speaking communities across Britain construct massive defensive hillforts like Maiden Castle.", category: "british" }
                ]
            },
            {
                era: "The Second Temple Era & Ancient Britain",
                events: [
                    { year: "c. 516 BCE", title: "Completion of the Second Temple", desc: "Following the Persian return from exile, the Second Temple is finished in Jerusalem.", category: "archaeology" },
                    { year: "54 BCE", title: "Julius Caesar Invades Britain", desc: "Roman legions cross the English Channel for the first time, clashing with Celtic British tribes.", category: "british" }
                ]
            },
            {
                era: "The Crucible: Pompeii & Roman Britain",
                events: [
                    { year: "70 CE", title: "Destruction of the Second Temple", desc: "Roman legions under Titus siege Jerusalem and utterly destroy the Second Temple, leaving only the Western Wall.", category: "archaeology" },
                    { year: "79 CE", title: "Mount Vesuvius Erupts (Pompeii)", desc: "While Roman generals are expanding into Britain, Mount Vesuvius erupts, perfectly preserving Pompeii and Herculaneum in ash.", category: "archaeology" }
                ]
            },
            {
                era: "Roman Britain & The Dark Ages",
                events: [
                    { year: "122 CE", title: "Construction of Hadrian's Wall", desc: "Emperor Hadrian orders a massive stone wall built across northern Britain to mark the frontier of the Roman Empire.", category: "british" },
                    { year: "c. 410 CE", title: "Romans Leave Britain", desc: "Rome withdraws its legions from Britain to defend the homeland, plunging Britain into the Anglo-Saxon transition era.", category: "british" }
                ]
            },
            {
                era: "Medieval Castles & Crusades",
                events: [
                    { year: "1066 CE", title: "The Norman Conquest of England", desc: "William the Conqueror defeats King Harold at the Battle of Hastings, fundamentally changing British language and law.", category: "british" },
                    { year: "1099 CE", title: "First Crusade Captures Jerusalem", desc: "Christian crusaders capture Jerusalem, establishing a medieval kingdom over the ancient ruins of the city.", category: "archaeology" }
                ]
            },
            {
                era: "Magna Carta & Early Parliaments",
                events: [
                    { year: "1215 CE", title: "King John Signs the Magna Carta", desc: "Rebellious barons force King John to sign the Magna Carta at Runnymede, establishing the principle that everyone is subject to the law.", category: "british" },
                    { year: "1265 CE", title: "First English Parliament", desc: "Simon de Montfort summons the first elected English parliament, laying the foundations for modern representative government.", category: "british" }
                ]
            },
            {
                era: "Industrial Power & Victorian Exploration",
                events: [
                    { year: "1837 CE", title: "Queen Victoria Ascends the Throne", desc: "The Victorian era begins, marking Britain's rise as the world's foremost industrial and naval superpower.", category: "british" },
                    { year: "1867 CE", title: "Beginnings of Modern Archaeology", desc: "Charles Warren begins underground excavations in Jerusalem, unearthing the foundations of the Temple Mount and ancient water systems.", category: "archaeology" }
                ]
            }
        ];

        function renderTimeline(filter = 'all') {
            const container = document.getElementById("timeline");
            container.innerHTML = "";

            timelineData.forEach(eraObj => {
                let filteredEvents = eraObj.events;
                if (filter !== 'all') {
                    filteredEvents = eraObj.events.filter(e => e.category === filter);
                }

                if (filteredEvents.length === 0) return;

                const eraBlock = document.createElement("div");
                eraBlock.className = "era-block";

                eraBlock.innerHTML = `
                    <div class="era-header">
                        <span class="era-title">${eraObj.era}</span>
                    </div>
                `;

                for (let i = 0; i < filteredEvents.length; i += 2) {
                    const leftEvent = filteredEvents[i];
                    const rightEvent = filteredEvents[i+1];

                    const row = document.createElement("div");
                    row.className = "row";

                    const leftCardHtml = leftEvent ? `
                        <div class="card cat-${leftEvent.category}">
                            <span class="year-badge">${leftEvent.year}</span>
                            <div class="card-title">${leftEvent.title}</div>
                            <p class="card-desc">${leftEvent.desc}</p>
                        </div>
                    ` : `<div class="empty-slot"></div>`;

                    const rightCardHtml = rightEvent ? `
                        <div class="card cat-${rightEvent.category}">
                            <span class="year-badge">${rightEvent.year}</span>
                            <div class="card-title">${rightEvent.title}</div>
                            <p class="card-desc">${rightEvent.desc}</p>
                        </div>
                    ` : `<div class="empty-slot"></div>`;

                    row.innerHTML = `
                        ${leftCardHtml}
                        <div class="center-node"></div>
                        ${rightCardHtml}
                    `;

                    eraBlock.appendChild(row);
                }

                container.appendChild(eraBlock);
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTimeline(cat);
        }

        renderTimeline();
    </script>
</body>
</html>
