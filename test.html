<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Plant Bio-Signal Visualizer & Native Audio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #020408;
      overflow: hidden;
      font-family: monospace;
      color: #f4f2ee;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(2, 4, 8, 0.85);
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      font-size: 11px;
      line-height: 1.5;
    }
    #legend {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(2, 4, 8, 0.85);
      padding: 14px 18px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      font-size: 11px;
      width: 240px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .control-buttons {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    button {
      background: #f4f2ee;
      color: #020408;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover {
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="info">
    SIGNAL SOURCE: <span id="inputMode" style="color: #ffde4a;">Interactive (Move Mouse / Mic)</span><br>
    Raw Delta: <span id="valDelta">0.50</span> | Raw Variance: <span id="valVariance">0.50</span>
  </div>

  <div id="legend">
    <strong style="display:block; margin-bottom:8px; border-bottom:1px solid #444; padding-bottom:4px;">RAINBOW SIGNAL MAPPING</strong>
    <div class="legend-item"><span><span class="color-dot" style="background:#ff3333;"></span>Red (Variance)</span><span id="legRed">0.00</span></div>
    <div class="legend-item"><span><span class="color-dot" style="background:#ff9933;"></span>Orange (Delta)</span><span id="legOrange">0.00</span></div>
    <div class="legend-item"><span><span class="color-dot" style="background:#ffff33;"></span>Yellow (Pitch/X)</span><span id="legYellow">0.00</span></div>
    <div class="legend-item"><span><span class="color-dot" style="background:#33cc33;"></span>Green (Velocity/Vol)</span><span id="legGreen">0.00</span></div>
    <div class="legend-item"><span><span class="color-dot" style="background:#3399ff;"></span>Blue (Pulse Time)</span><span id="legBlue">0.00</span></div>
    <div class="legend-item"><span><span class="color-dot" style="background:#9933ff;"></span>Indigo (Harmonic)</span><span id="legIndigo">0.00</span></div>
    <div class="legend-item"><span><span class="color-dot" style="background:#cc33ff;"></span>Violet (Total Energy)</span><span id="legViolet">0.00</span></div>
  </div>

  <div class="control-buttons">
    <button id="audioBtn" onclick="toggleAudioEngine()">Start Audio Soundscape</button>
    <button id="micBtn" onclick="toggleMic()">Enable Mic Reactivity</button>
  </div>

  <script>
    let targetDelta = 0.5;
    let targetVariance = 0.5;
    let smoothDelta = 0.5;
    let smoothVariance = 0.5;
    let inputParamX = 0.5; 
    let inputParamY = 0.5; 
    let mic, micActive = false;
    let midiStatus = "Searching for MIDI...";

    // Native Web Audio API variables
    let audioCtx;
    let masterGain;
    let mainFilter;
    let audioActive = false;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(RGB, 255);
      setupWebMIDI();
    }

    function draw() {
      background(2, 4, 8, 25);

      if (!micActive && midiStatus.includes("Searching")) {
        targetDelta = constrain(mouseX / width, 0.1, 1.0);
        targetVariance = constrain(mouseY / height, 0.1, 1.0);
        inputParamX = mouseX / width;
        inputParamY = mouseY / height;
      }

      if (micActive && mic) {
        let level = mic.getLevel();
        targetVariance = constrain(level * 6, 0.1, 1.0);
        targetDelta = constrain(map(sin(frameCount * 0.04), -1, 1, 0.2, 0.9), 0.1, 1.0);
        inputParamX = constrain(level * 10, 0, 1);
        inputParamY = constrain(abs(sin(frameCount * 0.1)), 0, 1);
      }

      smoothDelta = lerp(smoothDelta, targetDelta, 0.05);
      smoothVariance = lerp(smoothVariance, targetVariance, 0.05);

      // Map variance directly to native audio filter cutoff if running
      if (audioActive && mainFilter) {
        let targetCutoff = map(smoothVariance, 0, 1, 200, 4000);
        mainFilter.frequency.setTargetAtTime(targetCutoff, audioCtx.currentTime, 0.1);
      }

      // Calculate 7 rainbow signal aspects
      let sigRed    = smoothVariance;                            
      let sigOrange = smoothDelta;                               
      let sigYellow = inputParamX;                               
      let sigGreen  = inputParamY;                               
      let sigBlue   = (sin(frameCount * 0.05) + 1) / 2;          
      let sigIndigo = abs(cos(smoothDelta * PI + frameCount * 0.03)); 
      let sigViolet = (smoothDelta * smoothVariance);            

      document.getElementById('valDelta').innerText = smoothDelta.toFixed(2);
      document.getElementById('valVariance').innerText = smoothVariance.toFixed(2);
      document.getElementById('legRed').innerText = sigRed.toFixed(2);
      document.getElementById('legOrange').innerText = sigOrange.toFixed(2);
      document.getElementById('legYellow').innerText = sigYellow.toFixed(2);
      document.getElementById('legGreen').innerText = sigGreen.toFixed(2);
      document.getElementById('legBlue').innerText = sigBlue.toFixed(2);
      document.getElementById('legIndigo').innerText = sigIndigo.toFixed(2);
      document.getElementById('legViolet').innerText = sigViolet.toFixed(2);

      translate(width / 2, height / 2);

      // Render 7 Rainbow Fractal Layers
      noFill();
      
      push(); stroke(255, 51, 51, 150); strokeWeight(map(sigRed, 0, 1, 1, 3)); rotate(frameCount * 0.005); drawFractalBranch(map(sigRed, 0, 1, 50, 180), floor(map(sigRed, 0, 1, 2, 5))); pop();
      push(); stroke(255, 153, 51, 150); strokeWeight(1.5); rotate(-frameCount * 0.008); drawCustomBranch(120, 4, map(sigOrange, 0, 1, 0.1, 0.9)); pop();
      push(); stroke(255, 255, 51, 140); strokeWeight(2); rotate(sigYellow * TWO_PI); drawFractalBranch(100, 4); pop();
      push(); stroke(51, 204, 51, 160); strokeWeight(map(sigGreen, 0, 1, 0.5, 4)); rotate(frameCount * 0.012); drawFractalBranch(map(sigGreen, 0, 1, 40, 200), 3); pop();
      push(); stroke(51, 153, 255, 150); strokeWeight(1.2); rotate(-frameCount * 0.004); drawFractalBranch(map(sigBlue, 0, 1, 60, 220), 5); pop();
      push(); stroke(153, 51, 255, 140); strokeWeight(1.8); rotate(sigIndigo * PI); drawCustomBranch(140, 4, 0.5); pop();
      push(); stroke(204, 51, 255, 180); strokeWeight(map(sigViolet, 0, 1, 1, 3.5)); rotate(frameCount * 0.015); drawFractalBranch(map(sigViolet, 0, 1, 80, 160), 4); pop();
    }

    function drawFractalBranch(len, depth) {
      if (depth === 0) return;
      line(0, 0, 0, -len);
      translate(0, -len);
      push(); rotate(0.4); drawFractalBranch(len * 0.67, depth - 1); pop();
      push(); rotate(-0.4); drawFractalBranch(len * 0.67, depth - 1); pop();
    }

    function drawCustomBranch(len, depth, theta) {
      if (depth === 0) return;
      line(0, 0, 0, -len);
      translate(0, -len);
      push(); rotate(theta); drawCustomBranch(len * 0.67, depth - 1, theta); pop();
      push(); rotate(-theta); drawCustomBranch(len * 0.67, depth - 1, theta); pop();
    }

    // --- NATIVE WEB AUDIO API SYNTHESIZER ENGINE ---
    function toggleAudioEngine() {
      if (!audioActive) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Master Volume Gain Node
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

        // Low-pass Filter Node (brightness responds to plant variance)
        mainFilter = audioCtx.createBiquadFilter();
        mainFilter.type = 'lowpass';
        mainFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        mainFilter.Q.setValueAtTime(3, audioCtx.currentTime);

        // Connect chain: Filter -> Master Gain -> Speakers
        mainFilter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        audioActive = true;
        document.getElementById('audioBtn').innerText = 'Stop Audio Soundscape';
        document.getElementById('audioBtn').style.background = '#4af3a2';
      } else {
        if (audioCtx) audioCtx.close();
        audioActive = false;
        document.getElementById('audioBtn').innerText = 'Start Audio Soundscape';
        document.getElementById('audioBtn').style.background = '#f4f2ee';
      }
    }

    // Trigger a native web audio synth note when MIDI note arrives or mouse is clicked
    function playNativeSynthTone(freq, velocity = 0.8) {
      if (!audioActive || !audioCtx) return;

      let osc = audioCtx.createOscillator();
      let noteGain = audioCtx.createGain();

      // Soft ambient tone blend (triangle wave)
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // Envelope configuration (Soft Attack, Long Lush Release)
      let now = audioCtx.currentTime;
      let peakGain = map(velocity, 0, 127, 0.05, 0.3);

      noteGain.gain.setValueAtTime(0, now);
      noteGain.gain.linearRampToValueAtTime(peakGain, now + 0.2); // Attack
      noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0); // Release

      // Connect oscillator -> envelope gain -> shared filter chain
      osc.connect(noteGain);
      noteGain.connect(mainFilter);

      osc.start(now);
      osc.stop(now + 3.1);
    }

    // Mouse click triggers a synthesized ambient note when audio is on
    function mousePressed() {
      if (audioActive && mouseY < height - 60) {
        let freq = map(mouseX, 0, width, 110, 880); // Bass to High pitch scale
        playNativeSynthTone(freq, 100);
      }
    }

    // --- WEB MIDI SUPPORT ---
    function setupWebMIDI() {
      if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
      } else {
        document.getElementById('inputMode').innerText = "Web MIDI not supported";
      }
    }

    function onMIDISuccess(midiAccess) {
      document.getElementById('inputMode').innerText = "MIDI Connected (Hardware Active)";
      document.getElementById('inputMode').style.color = '#4af3a2';
      for (let input of midiAccess.inputs.values()) {
        input.onmidimessage = getMIDIMessage;
      }
    }

    function onMIDIFailure() {
      document.getElementById('inputMode').innerText = "MIDI unavailable - Using Mouse/Mic";
    }

    function getMIDIMessage(message) {
      let [command, note, velocity] = message.data;
      if (command === 144 && velocity > 0) {
        targetDelta = map(note, 0, 127, 0.1, 1.0);
        targetVariance = map(velocity, 0, 127, 0.1, 1.0);
        inputParamX = note / 127;
        inputParamY = velocity / 127;

        // Convert MIDI note number to Frequency in Hertz and play native sound
        let freq = 440 * Math.pow(2, (note - 69) / 12);
        playNativeSynthTone(freq, velocity);
      }
    }

    function toggleMic() {
      if (!micActive) {
        mic = new p5.AudioIn();
        mic.start();
        userStartAudio();
        micActive = true;
        document.getElementById('micBtn').innerText = 'Disable Mic';
        document.getElementById('inputMode').innerText = 'Microphone Audio Reactive';
        document.getElementById('inputMode').style.color = '#4af3a2';
      } else {
        mic.stop();
        micActive = false;
        document.getElementById('micBtn').innerText = 'Enable Mic Reactivity';
        document.getElementById('inputMode').innerText = 'Interactive (Move Mouse)';
        document.getElementById('inputMode').style.color = '#ffde4a';
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
