<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sansevieria Trifasciata Laser Synthesizer & Pot</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000000;
      overflow: hidden;
      font-family: monospace;
      color: #00ffcc;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 10, 5, 0.85);
      padding: 12px 16px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
      pointer-events: none;
      font-size: 11px;
      line-height: 1.5;
      z-index: 10;
    }
    #legend-container {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }
    #legend {
      background: rgba(0, 10, 5, 0.85);
      padding: 14px 18px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
      font-size: 11px;
      width: 250px;
      margin-bottom: 6px;
    }
    #lastUpdated {
      font-size: 9px;
      color: #008866;
      letter-spacing: 0.5px;
      padding-right: 4px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .control-buttons {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      pointer-events: auto;
      z-index: 10;
    }
    button, select {
      background: #000000;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover, select:hover {
      background: #00ffcc;
      color: #000000;
    }

    #configModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    #configModal.open {
      display: flex;
    }
    .modal-content {
      background: #05080f;
      border: 1px solid #00ffcc;
      border-radius: 6px;
      width: 480px;
      max-height: 85vh;
      padding: 24px;
      box-sizing: border-box;
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(0,255,204,0.3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00ffcc;
      padding-bottom: 12px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 13px;
      color: #00ffcc;
    }
    .close-btn {
      background: transparent;
      color: #00ffcc;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    .channel-box {
      background: rgba(0, 255, 204, 0.03);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 12px;
      box-sizing: border-box;
      width: 100%;
    }
    .channel-header {
      font-weight: bold;
      font-size: 11px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      box-sizing: border-box;
    }
    .control-group label {
      font-size: 10px;
      color: #008866;
      text-transform: uppercase;
    }
    .control-group select, .control-group input[type="range"] {
      width: 100%;
      background: #000;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      box-sizing: border-box;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Config Modal -->
  <div id="configModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>SANSEVIERIA SOUND CONFIG</span>
        <button class="close-btn" onclick="toggleConfigModal()">✕</button>
      </div>
      
      <div class="channel-box">
        <div class="channel-header" style="color: #ffde4a;">Global Master Parameters</div>
        <div class="control-group">
          <label>Filter Resonance (Q): <span id="lbl_resonance">4.0</span></label>
          <input type="range" id="global_resonance" min="1" max="20" step="0.5" value="4.0" oninput="updateGlobalParams()">
        </div>
        <div class="control-group">
          <label>Arpeggio Mode</label>
          <select id="global_arp" onchange="updateGlobalParams()">
            <option value="off">Single Tone</option>
            <option value="cascade">Harmonic Cascade</option>
          </select>
        </div>
      </div>

      <div id="modalChannelContainer"></div>
    </div>
  </div>

  <div id="info">
    SANSEVIERIA LASER SYNTH<br>
    Source: <span id="inputMode" style="color: #ffff00;">Interactive (Mouse / MIDI / Mic)</span><br>
    Note/Delta: <span id="valDelta">0.50</span> | Velocity/Variance: <span id="valVariance">0.50</span>
  </div>

  <div id="legend-container">
    <div id="legend">
      <strong style="display:block; margin-bottom:8px; border-bottom:1px solid #00ffcc; padding-bottom:4px;">CHANNEL ACTIVITY</strong>
      <div id="activeLegendList"></div>
    </div>
    <div id="lastUpdated">Code updated: <span id="timestamp">--/--/---- --:--:--</span></div>
  </div>

  <div class="control-buttons">
    <button id="audioBtn" onclick="toggleAudioEngine()">Start Soundscape</button>
    <button id="micBtn" onclick="toggleMic()">Enable Mic</button>
    <button onclick="toggleConfigModal()">Config Audio</button>
    <button id="modeBtn" onclick="toggleViewMode()">Switch Mode: Psychedelia</button>
  </div>

  <script>
    let targetDelta = 0.5;
    let targetVariance = 0.5;
    let smoothDelta = 0.5;
    let smoothVariance = 0.5;
    let mic, micActive = false;
    let midiStatus = "Searching for MIDI...";

    let audioCtx, masterGain, mainFilter, audioActive = false;
    let viewMode = 'sansevieria'; // Default to Sansevieria laser plant mode
    
    let globalConfig = {
      resonance: 4.0,
      arp: 'off'
    };

    const allChannels = [
      { id: 1, name: "Ch 1 (Red)", color: "#ff3333", rgb: [255, 51, 51], wave: "triangle", attack: 0.1, release: 3.5, volume: 0.8, envelope: 0, spawnX: 0, spawnY: 0 },
      { id: 2, name: "Ch 2 (Orange)", color: "#ff9933", rgb: [255, 153, 51], wave: "triangle", attack: 0.1, release: 3.5, volume: 0.8, envelope: 0, spawnX: 0, spawnY: 0 },
      { id: 3, name: "Ch 3 (Yellow)", color: "#ffff33", rgb: [255, 255, 51], wave: "sawtooth", attack: 0.1, release: 3.5, volume: 0.8, envelope: 0, spawnX: 0, spawnY: 0 },
      { id: 4, name: "Ch 4 (Green)", color: "#33cc33", rgb: [51, 204, 51], wave: "square", attack: 0.1, release: 3.5, volume: 0.8, envelope: 0, spawnX: 0, spawnY: 0 },
      { id: 5, name: "Ch 5 (Blue)", color: "#3399ff", rgb: [51, 153, 255], wave: "sine", attack: 0.2, release: 4.0, volume: 0.8, envelope: 0, spawnX: 0, spawnY: 0 },
      { id: 6, name: "Ch 6 (Indigo)", color: "#9933ff", rgb: [153, 51, 255], wave: "triangle", attack: 0.1, release: 3.5, volume: 0.8, envelope: 0, spawnX: 0, spawnY: 0 },
      { id: 7, name: "Ch 7 (Violet)", color: "#cc33ff", rgb: [204, 51, 255], wave: "sawtooth", attack: 0.1, release: 3.5, volume: 0.8, envelope: 0, spawnX: 0, spawnY: 0 }
    ];

    let lightParticles = [];
    let midiActivityCounter = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(RGB, 255);
      
      allChannels.forEach((ch, idx) => {
        let angle = (TWO_PI / 7) * idx;
        ch.spawnX = width / 2 + cos(angle) * 150;
        ch.spawnY = height / 2 + sin(angle) * 150;
      });

      buildConfigModalUI();
      setupWebMIDI();
      
      let loadTime = new Date();
      document.getElementById('timestamp').innerText = loadTime.toLocaleString();
    }

    function buildConfigModalUI() {
      const container = document.getElementById('modalChannelContainer');
      container.innerHTML = '';
      allChannels.forEach(ch => {
        let box = document.createElement('div');
        box.className = 'channel-box';
        box.innerHTML = `
          <div class="channel-header"><span class="color-dot" style="background:${ch.color};"></span>${ch.name}</div>
          <div class="control-group">
            <label>Waveform</label>
            <select id="ch${ch.id}_wave" onchange="updateChannelParams(${ch.id})">
              <option value="triangle" ${ch.wave==='triangle'?'selected':''}>Triangle</option>
              <option value="sine" ${ch.wave==='sine'?'selected':''}>Sine</option>
              <option value="sawtooth" ${ch.wave==='sawtooth'?'selected':''}>Sawtooth</option>
              <option value="square" ${ch.wave==='square'?'selected':''}>Square</option>
            </select>
          </div>
          <div class="control-group">
            <label>Attack: <span id="lbl_ch${ch.id}_atk">${ch.attack}</span>s</label>
            <input type="range" id="ch${ch.id}_attack" min="0.01" max="1.0" step="0.05" value="${ch.attack}" oninput="updateChannelParams(${ch.id})">
          </div>
          <div class="control-group">
            <label>Release Tail: <span id="lbl_ch${ch.id}_rel">${ch.release}</span>s</label>
            <input type="range" id="ch${ch.id}_release" min="0.5" max="8.0" step="0.2" value="${ch.release}" oninput="updateChannelParams(${ch.id})">
          </div>
          <div class="control-group">
            <label>Volume: <span id="lbl_ch${ch.id}_vol">${ch.volume}</span></label>
            <input type="range" id="ch${ch.id}_volume" min="0.1" max="1.5" step="0.1" value="${ch.volume}" oninput="updateChannelParams(${ch.id})">
          </div>
        `;
        container.appendChild(box);
      });
    }

    function toggleConfigModal() {
      document.getElementById('configModal').classList.toggle('open');
    }

    function toggleViewMode() {
      if (viewMode === 'sansevieria') {
        viewMode = 'psychedelia';
        document.getElementById('modeBtn').innerText = 'Switch Mode: Laser Plant';
      } else {
        viewMode = 'sansevieria';
        document.getElementById('modeBtn').innerText = 'Switch Mode: Psychedelia';
      }
    }

    function updateGlobalParams() {
      globalConfig.resonance = parseFloat(document.getElementById('global_resonance').value);
      globalConfig.arp = document.getElementById('global_arp').value;
      document.getElementById('lbl_resonance').innerText = globalConfig.resonance.toFixed(1);

      if (mainFilter && audioCtx) {
        mainFilter.Q.setValueAtTime(globalConfig.resonance, audioCtx.currentTime);
      }
    }

    function updateChannelParams(id) {
      let ch = allChannels.find(c => c.id === id);
      ch.wave = document.getElementById(`ch${id}_wave`).value;
      ch.attack = parseFloat(document.getElementById(`ch${id}_attack`).value);
      ch.release = parseFloat(document.getElementById(`ch${id}_release`).value);
      ch.volume = parseFloat(document.getElementById(`ch${id}_volume`).value);

      document.getElementById(`lbl_ch${id}_atk`).innerText = ch.attack.toFixed(2);
      document.getElementById(`lbl_ch${id}_rel`).innerText = ch.release.toFixed(1);
      document.getElementById(`lbl_ch${id}_vol`).innerText = ch.volume.toFixed(1);
    }

    function spawnLightBurst(px, py, chIndex, velocity, note) {
      let ch = allChannels[chIndex % allChannels.length];
      ch.envelope = 1.0; 
      
      ch.spawnX = lerp(ch.spawnX, map(note, 0, 127, width * 0.1, width * 0.9), 0.4);
      ch.spawnY = lerp(ch.spawnY, py, 0.4);

      let count = floor(map(velocity, 0, 127, 10, 35));
      let spreadSpeed = map(velocity, 0, 127, 2, 9);

      for (let i = 0; i < count; i++) {
        let angle = random(TWO_PI);
        let speed = random(1, spreadSpeed);
        lightParticles.push({
          x: ch.spawnX,
          y: ch.spawnY,
          vx: cos(angle) * speed,
          vy: sin(angle) * speed,
          color: ch.rgb,
          life: 255,
          decay: random(3, 7),
          size: random(3, 9)
        });
      }
    }

    function draw() {
      background(0, 0, 0, 45);

      if (!micActive && midiStatus.includes("Searching")) {
        targetDelta = constrain(mouseX / width, 0.1, 1.0);
        targetVariance = constrain(mouseY / height, 0.1, 1.0);
        
        if (mouseIsPressed && mouseY < height - 60) {
          midiActivityCounter++;
          spawnLightBurst(mouseX, mouseY, midiActivityCounter, 100, map(mouseX, 0, width, 20, 100));
        }
      }

      if (micActive && mic) {
        let level = mic.getLevel();
        targetVariance = constrain(level * 6, 0.1, 1.0);
        targetDelta = constrain(map(sin(frameCount * 0.04), -1, 1, 0.2, 0.9), 0.1, 1.0);
        
        if (level > 0.02) {
          midiActivityCounter++;
          spawnLightBurst(width * 0.5 + random(-200, 200), height * 0.5 + random(-200, 200), midiActivityCounter, level * 127, 60);
        }
      }

      smoothDelta = lerp(smoothDelta, targetDelta, 0.05);
      smoothVariance = lerp(smoothVariance, targetVariance, 0.05);

      if (audioActive && mainFilter) {
        let targetCutoff = map(smoothVariance, 0, 1, 200, 4000);
        mainFilter.frequency.setTargetAtTime(targetCutoff, audioCtx.currentTime, 0.1);
      }

      let activeListHTML = "";
      allChannels.forEach((ch) => {
        ch.envelope = max(0.0, ch.envelope - 0.03);
        activeListHTML += `
          <div class="legend-item">
            <span><span class="color-dot" style="background:${ch.color};"></span>${ch.name}</span>
            <span>${ch.envelope.toFixed(2)}</span>
          </div>
        `;
      });
      document.getElementById('activeLegendList').innerHTML = activeListHTML;

      document.getElementById('valDelta').innerText = smoothDelta.toFixed(2);
      document.getElementById('valVariance').innerText = smoothVariance.toFixed(2);

      if (viewMode === 'psychedelia') {
        // --- PSYCHEDELIA LIGHT SYNTH MODE ---
        noStroke();
        for (let i = lightParticles.length - 1; i >= 0; i--) {
          let p = lightParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;

          if (p.life <= 0) {
            lightParticles.splice(i, 1);
            continue;
          }

          fill(p.color[0], p.color[1], p.color[2], p.life);
          rect(p.x, p.y, p.size, p.size);

          let mirrorX = width - p.x;
          let mirrorY = height - p.y;
          rect(mirrorX, p.y, p.size, p.size);
          rect(p.x, mirrorY, p.size, p.size);
          rect(mirrorX, mirrorY, p.size, p.size);
        }
      } else {
        // --- SANSEVIERIA TRIFASCIATA LASER SYNTH & POT MODE ---
        push();
        let potBaseX = width / 2;
        let potBaseY = height / 2 + 160;

        // Draw the dark grey plant pot matching the reference image style
        fill(25, 30, 40);
        stroke(50, 65, 80);
        strokeWeight(2);
        
        beginShape();
        vertex(potBaseX - 90, potBaseY - 140); // Rim left
        vertex(potBaseX + 90, potBaseY - 140); // Rim right
        vertex(potBaseX + 70, potBaseY + 60);  // Base right
        vertex(potBaseX - 70, potBaseY + 60);  // Base left
        endShape(CLOSE);

        // Pot rim detail line
        noFill();
        stroke(70, 90, 110);
        strokeWeight(3);
        ellipse(potBaseX, potBaseY - 140, 180, 20);

        // Pot surface soil bed
        fill(15, 12, 10);
        noStroke();
        ellipse(potBaseX, potBaseY - 140, 172, 14);

        // Render Sansevieria Trifasciata Laser Leaves emerging directly from the pot rim
        translate(potBaseX, potBaseY - 140);
        noFill();

        let leafOffsets = [-70, -48, -25, 0, 25, 48, 70];
        let leafHeights = [280, 330, 370, 410, 370, 330, 280];

        allChannels.forEach((ch, idx) => {
          stroke(ch.rgb[0], ch.rgb[1], ch.rgb[2], 230);
          strokeWeight(2.5);

          beginShape();
          let baseHeight = leafHeights[idx];
          let xBase = leafOffsets[idx];

          let intensity = ch.envelope;
          let glitchJitter = intensity * 25;
          let shearFactor = (idx - 3) * smoothDelta * 0.4;

          for (let y = 0; y <= baseHeight; y += 12) {
            let progress = y / baseHeight;
            let widthMod = sin(progress * PI) * 20;
            
            let glitchX = 0;
            if (intensity > 0.05) {
              if (idx % 3 === 0) {
                glitchX = random(-glitchJitter, glitchJitter) * sin(y * 0.1);
              } else if (idx % 3 === 1) {
                glitchX = sin(y * 0.05 + frameCount * 0.5) * glitchJitter * 1.5;
              } else {
                glitchX = (random() > 0.7 ? random(-glitchJitter * 2, glitchJitter * 2) : 0);
              }
            }

            let px = xBase + glitchX + (progress * shearFactor * 50);
            let py = -y;
            vertex(px - widthMod, py);
          }

          for (let y = baseHeight; y >= 0; y -= 12) {
            let progress = y / baseHeight;
            let widthMod = sin(progress * PI) * 20;
            let glitchX = 0;
            if (intensity > 0.05) {
              glitchX = random(-glitchJitter, glitchJitter) * cos(y * 0.1);
            }
            let px = xBase + glitchX + (progress * shearFactor * 50);
            let py = -y;
            vertex(px + widthMod, py);
          }
          endShape(CLOSE);
        });
        pop();
      }
    }

    function toggleAudioEngine() {
      if (!audioActive) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

        mainFilter = audioCtx.createBiquadFilter();
        mainFilter.type = 'lowpass';
        mainFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        mainFilter.Q.setValueAtTime(globalConfig.resonance, audioCtx.currentTime);

        mainFilter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        audioActive = true;
        document.getElementById('audioBtn').innerText = 'Stop Soundscape';
        document.getElementById('audioBtn').style.background = '#00ffcc';
        document.getElementById('audioBtn').style.color = '#000000';
      } else {
        if (audioCtx) audioCtx.close();
        audioActive = false;
        document.getElementById('audioBtn').innerText = 'Start Soundscape';
        document.getElementById('audioBtn').style.background = '#000000';
        document.getElementById('audioBtn').style.color = '#00ffcc';
      }
    }

    function playChannelTone(freq, velocity = 0.8, channelIndex = 0, delayOffset = 0) {
      if (!audioActive || !audioCtx) return;
      
      let ch = allChannels[channelIndex % allChannels.length];

      let osc = audioCtx.createOscillator();
      let noteGain = audioCtx.createGain();

      osc.type = ch.wave;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delayOffset);

      let now = audioCtx.currentTime + delayOffset;
      let peakGain = map(velocity, 0, 127, 0.03, 0.25) * ch.volume;

      noteGain.gain.setValueAtTime(0, now);
      noteGain.gain.linearRampToValueAtTime(peakGain, now + ch.attack);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, now + ch.release);

      osc.connect(noteGain);
      noteGain.connect(mainFilter);

      osc.start(now);
      osc.stop(now + ch.release + 0.1);
    }

    function triggerVoiceCluster(baseFreq, velocity, channel, note) {
      let chIndex = (channel === 1) ? (Math.floor(note / 18) % 7) : ((channel - 1) % allChannels.length);
      
      playChannelTone(baseFreq, velocity, chIndex, 0);
      spawnLightBurst(map(note, 20, 100, width * 0.1, width * 0.9, true), map(velocity, 0, 127, height * 0.8, height * 0.2, true), chIndex, velocity, note);

      if (globalConfig.arp === 'cascade') {
        playChannelTone(baseFreq * 1.25, velocity * 0.8, (chIndex + 1) % allChannels.length, 0.15);
        playChannelTone(baseFreq * 1.5, velocity * 0.6, (chIndex + 2) % allChannels.length, 0.3);
      }
    }

    function mousePressed() {
      if (document.getElementById('configModal').classList.contains('open')) return;

      if (audioActive && mouseY < height - 60) {
        let freq = map(mouseX, 0, width, 110, 880);
        midiActivityCounter++;
        triggerVoiceCluster(freq, 100, midiActivityCounter, map(mouseX, 0, width, 30, 90));
      }
    }

    function setupWebMIDI() {
      if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
      } else {
        document.getElementById('inputMode').innerText = "Web MIDI not supported";
      }
    }

    function onMIDISuccess(midiAccess) {
      document.getElementById('inputMode').innerText = "MIDI Connected (Pocket SCÍON Active)";
      document.getElementById('inputMode').style.color = '#00ffcc';
      for (let input of midiAccess.inputs.values()) {
        input.onmidimessage = getMIDIMessage;
      }
    }

    function onMIDIFailure() {
      document.getElementById('inputMode').innerText = "MIDI unavailable - Using Mouse/Mic";
    }

    function getMIDIMessage(message) {
      let statusByte = message.data[0];
      let command = statusByte & 0xF0;
      let channel = (statusByte & 0X0F) + 1;
      let note = message.data[1];
      let velocity = message.data[2];

      if (command === 144 && velocity > 0) {
        targetDelta = map(note, 0, 127, 0.1, 1.0);
        targetVariance = map(velocity, 0, 127, 0.1, 1.0);
        inputParamX = note / 127;
        inputParamY = velocity / 127;

        let freq = 440 * Math.pow(2, (note - 69) / 12);
        triggerVoiceCluster(freq, velocity, channel, note);
      }
    }

    function toggleMic() {
      if (!micActive) {
        mic = new p5.AudioIn();
        mic.start();
        userStartAudio();
        micActive = true;
        document.getElementById('micBtn').innerText = 'Disable Mic';
        document.getElementById('inputMode').innerText = 'Microphone Audio Reactive';
        document.getElementById('inputMode').style.color = '#00ffcc';
      } else {
        mic.stop();
        micActive = false;
        document.getElementById('micBtn').innerText = 'Enable Mic';
        document.getElementById('inputMode').innerText = 'Interactive (Mouse / MIDI)';
        document.getElementById('inputMode').style.color = '#ffff00';
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
