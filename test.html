<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Plant Fractal Visualizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #020408;
      overflow: hidden;
      font-family: monospace;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #4af3a2;
      font-size: 12px;
      letter-spacing: 1px;
      background: rgba(2, 4, 8, 0.8);
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid rgba(74, 243, 162, 0.3);
      pointer-events: none;
      line-height: 1.5;
    }
    #micBtn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: #4af3a2;
      color: #020408;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: monospace;
      pointer-events: auto;
    }
    #micBtn:hover {
      background: #76ffc2;
    }
  </style>
</head>
<body>

  <div id="info">
    BIOLUMINESCENT PLANT VISUALIZER<br>
    Input Mode: <span id="inputMode" style="color: #ffde4a;">Interactive (Move Mouse / Enable Mic)</span><br>
    Delta (Complexity): <span id="valDelta">0.50</span><br>
    Variance (Activity): <span id="valVariance">0.50</span>
  </div>

  <button id="micBtn" onclick="toggleMic()">Enable Mic Reactivity</button>

  <script>
    let targetDelta = 0.5;
    let targetVariance = 0.5;
    let smoothDelta = 0.5;
    let smoothVariance = 0.5;
    let angleSpeed = 0.01;
    let mic, micActive = false;
    let midiStatus = "Searching for MIDI...";

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(HSB, 360, 100, 100, 100);
      setupWebMIDI();
    }

    function draw() {
      background(210, 80, 4, 15);

      // Fallback interaction: If no MIDI/Mic input, use mouse position to drive the fractal
      if (!micActive && midiStatus.includes("Searching")) {
        targetDelta = constrain(mouseX / width, 0.1, 1.0);
        targetVariance = constrain(mouseY / height, 0.1, 1.0);
      }

      // If microphone is active, map audio volume to variance and frequency to delta
      if (micActive && mic) {
        let level = mic.getLevel();
        targetVariance = constrain(level * 5, 0.1, 1.0);
        targetDelta = constrain(map(sin(frameCount * 0.05), -1, 1, 0.2, 0.9), 0.1, 1.0);
      }

      smoothDelta = lerp(smoothDelta, targetDelta, 0.05);
      smoothVariance = lerp(smoothVariance, targetVariance, 0.05);

      document.getElementById('valDelta').innerText = smoothDelta.toFixed(2);
      document.getElementById('valVariance').innerText = smoothVariance.toFixed(2);

      translate(width / 2, height / 2);

      let branches = floor(map(smoothVariance, 0, 1, 3, 7, true));
      angleSpeed = map(smoothDelta, 0, 1, 0.002, 0.03);
      let baseLength = map(smoothDelta, 0, 1, 80, 240, true);

      noFill();
      let layers = 4;
      for (let i = 0; i < layers; i++) {
        push();
        rotate(frameCount * angleSpeed * (i % 2 === 0 ? 1 : -1) + (i * TWO_PI / layers));
        
        let hueVal = (160 + sin(frameCount * 0.02 + i) * 40) % 360;
        let alphaVal = map(i, 0, layers, 60, 20);
        
        stroke(hueVal, 90, 90, alphaVal);
        strokeWeight(map(i, 0, layers, 2.5, 0.8));

        branch(baseLength, branches);
        pop();
      }
    }

    function branch(len, depth) {
      if (depth === 0) return;

      line(0, 0, 0, -len);
      translate(0, -len);

      let theta = map(smoothVariance, 0, 1, 0.2, 0.8);

      push();
      rotate(theta);
      branch(len * 0.67, depth - 1);
      pop();

      push();
      rotate(-theta);
      branch(len * 0.67, depth - 1);
      pop();
    }

    // Web MIDI Support for Hardware Devices over USB-C
    function setupWebMIDI() {
      if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
      } else {
        midiStatus = "Web MIDI not supported in this browser";
        document.getElementById('inputMode').innerText = midiStatus;
      }
    }

    function onMIDISuccess(midiAccess) {
      midiStatus = "MIDI Connected";
      document.getElementById('inputMode').innerText = midiStatus;
      document.getElementById('inputMode').style.color = '#4af3a2';

      for (let input of midiAccess.inputs.values()) {
        input.onmidimessage = getMIDIMessage;
      }
    }

    function onMIDIFailure() {
      midiStatus = "MIDI access denied/unavailable";
    }

    function getMIDIMessage(message) {
      let [command, note, velocity] = message.data;
      // Map incoming MIDI notes/velocity to fractal metrics
      if (command === 144 && velocity > 0) { // Note On
        targetDelta = map(note, 0, 127, 0.1, 1.0);
        targetVariance = map(velocity, 0, 127, 0.1, 1.0);
      }
    }

    function toggleMic() {
      if (!micActive) {
        mic = new p5.AudioIn();
        mic.start();
        userStartAudio();
        micActive = true;
        document.getElementById('micBtn').innerText = 'Disable Mic';
        document.getElementById('inputMode').innerText = 'Microphone Audio Reactive';
        document.getElementById('inputMode').style.color = '#4af3a2';
      } else {
        mic.stop();
        micActive = false;
        document.getElementById('micBtn').innerText = 'Enable Mic Reactivity';
        document.getElementById('inputMode').innerText = 'Interactive (Move Mouse)';
        document.getElementById('inputMode').style.color = '#ffde4a';
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
